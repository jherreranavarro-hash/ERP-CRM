; /etc/supervisor/conf.d/erp.conf
; Colas con prioridad (mantenedor "Rendimiento, colas y caché"): dte > caja > correo > default > reportes.
; Un worker dedicado a DTE para que la emisión nunca espere detrás de un reporte.

[program:erp-cola-dte]
command=php /var/www/erp/artisan queue:work redis --queue=dte --sleep=1 --tries=6 --max-time=3600
user=erp
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=120
stdout_logfile=/var/log/erp/cola-dte.log
redirect_stderr=true

[program:erp-cola-general]
command=php /var/www/erp/artisan queue:work redis --queue=dte,caja,correo,default,reportes --sleep=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
user=erp
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=120
stdout_logfile=/var/log/erp/cola-general.log
redirect_stderr=true

[program:erp-reverb]
command=php /var/www/erp/artisan reverb:start --host=127.0.0.1 --port=8080
user=erp
autostart=true
autorestart=true
stdout_logfile=/var/log/erp/reverb.log
redirect_stderr=true
