# /etc/nginx/sites-available/erp  (certificado con certbot o el de la empresa)
server {
    listen 80;
    server_name erp.ejemplo.cl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name erp.ejemplo.cl;
    root /var/www/erp/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/erp.ejemplo.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.ejemplo.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Las cabeceras de seguridad (CSP, HSTS, X-Frame-Options...) las pone la app.
    server_tokens off;
    client_max_body_size 20m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Tiempo real (Reverb) por el mismo dominio: wss://erp.ejemplo.cl/app/...
    location /app {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
        proxy_pass http://127.0.0.1:8080;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(js|css|woff2?|svg|png|jpg|webp)$ { expires 30d; access_log off; try_files $uri =404; }
}
