# Tiempo real (Reverb) por el mismo puerto que la app: ws://localhost:8000/app/...
# El nombre "reverb" se resuelve en cada conexión (DNS interno de Docker), así nginx
# arranca aunque el servicio Reverb todavía no exista.
location /app {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $reverb_upstream http://reverb:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
    proxy_pass $reverb_upstream;
}
