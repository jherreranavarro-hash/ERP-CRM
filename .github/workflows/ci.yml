name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: erp_app
      DB_PASSWORD: app_ci
      DB_OWNER_USERNAME: erp_owner
      DB_OWNER_PASSWORD: owner_ci
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, redis, intl, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Roles de PostgreSQL
        run: psql -h 127.0.0.1 -U postgres -v owner_pass="'owner_ci'" -v app_pass="'app_ci'" -f database/setup/roles.sql

      - name: Dependencias
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Auditoría de dependencias
        run: |
          composer audit
          npm audit --audit-level=high --omit=dev

      - name: Frontend (tipos y build)
        run: |
          npx vue-tsc --noEmit
          npm run build

      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

      - name: Configuración de producción segura
        run: |
          if grep -Eq '^APP_DEBUG=true' .env.production 2>/dev/null; then
            echo "APP_DEBUG=true en .env.production" && exit 1
          fi
          grep -q "'debug' => (bool) env('APP_DEBUG', false)" config/app.php
